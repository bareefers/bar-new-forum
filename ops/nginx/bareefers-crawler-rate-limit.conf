# Included from http {} via /etc/nginx/conf.d/*.conf
# Empty $bareefers_crawler_rl_key => no rate limit (nginx skips empty limit_req keys).

map $http_user_agent $bareefers_crawler_rl_key {
    default "";
    ~*Bytespider       $binary_remote_addr;
    ~*GPTBot          $binary_remote_addr;
    ~*ChatGPT-User    $binary_remote_addr;
    ~*ClaudeBot       $binary_remote_addr;
    ~*Claude-Web      $binary_remote_addr;
    ~*anthropic-ai    $binary_remote_addr;
    ~*Amazonbot       $binary_remote_addr;
}

# Matched crawlers only: nginx only supports r/s or r/m — ~1 req/min sustained (per IP).
limit_req_zone $bareefers_crawler_rl_key zone=bareefers_aggressive_crawlers:20m rate=1r/m;
