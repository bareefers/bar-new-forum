# Live server also loads:
#   /etc/nginx/conf.d/bareefers-crawler-rate-limit.conf  (repo: xenforo/nginx/bareefers-crawler-rate-limit.conf)
#   /var/www/bareefers.org/robots.txt                    (repo: xenforo/nginx/robots-bareefers.org.txt)
# and adds limit_req inside "location /forum/ { ... }" (see xenforo/scripts/patch-bareefers-nginx-forum-rate-limit.py).
#
# Port 80: redirect to HTTPS (except ACME challenge for acme.sh renewal)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bareefers.org www.bareefers.org beta.bareefers.org;

    location /.well-known/acme-challenge/ {
        root /var/www/bareefers.org;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: main site (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bareefers.org www.bareefers.org beta.bareefers.org;

    ssl_certificate     /etc/nginx/ssl/beta.bareefers.org.cer;
    ssl_certificate_key /etc/nginx/ssl/beta.bareefers.org.key;

    # Resolver + variable proxy_pass so nginx starts even if barcode.bareefers.org is not resolvable at boot.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    root /var/www/bareefers.org;
    index index.php index.html;

    location /forum/ {
        try_files $uri $uri/ /forum/index.php?$query_string;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ^~ /bc/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $cors_allowed_origin;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since";

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_allowed_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since";
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }

        set $bc_upstream_host barcode.bareefers.org;
        proxy_pass https://$bc_upstream_host;
        proxy_ssl_server_name on;
        proxy_ssl_name barcode.bareefers.org;
        proxy_set_header Host barcode.bareefers.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
